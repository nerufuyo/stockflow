server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        # Docker's DNS, re-resolved at runtime: a restarted backend is found again, and a stopped
        # one fails within seconds so the UI reaches its error state instead of hanging.
        resolver 127.0.0.11 valid=5s;
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_connect_timeout 3s;
    }
}

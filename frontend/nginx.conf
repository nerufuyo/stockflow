server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        # Resolve at request time so a stopped backend fails fast and a restarted one is found again.
        resolver 127.0.0.11 valid=5s;
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_connect_timeout 3s;
    }
}
